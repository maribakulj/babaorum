name: Public source checks

on:
  push:
    branches: [main, 'public-ready/**']
  pull_request:

permissions:
  contents: read

jobs:
  source-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch only this commit's ancestry when needed
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin "$GITHUB_SHA"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: config/requirements-ci.txt
      - run: python -m pip install -r config/requirements-ci.txt
      - run: python -B scripts/check_public_source.py
      - name: Synthetic tests only
        run: >-
          python -m pytest -q -p no:cacheprovider
          --basetemp="${RUNNER_TEMP}/public-source-tests"
